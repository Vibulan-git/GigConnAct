    <!-- Global Error Catcher -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            // Ignore extension or third-party script errors (where source is undefined or not from our domains)
            if (!source || (source.indexOf('gigconnact.de') === -1 && source.indexOf('gigconnact.web.app') === -1 && source.indexOf('app_v42.js') === -1 && source.indexOf('app.js') === -1 && source.indexOf('localhost') === -1 && source.indexOf('127.0.0.1') === -1)) {
                console.warn("Ignored cross-domain/extension error:", message, "Source:", source);
                return false; 
            }
            var div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = '#ef4444';
            div.style.color = '#fff';
            div.style.padding = '0.75rem 1rem';
            div.style.zIndex = '999999';
            div.style.fontFamily = 'monospace';
            div.style.fontSize = '0.85rem';
            div.style.boxSizing = 'border-box';
            div.style.textAlign = 'left';
            div.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
            div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;"><div><strong>JavaScript Fehler:</strong> ' + message + '<br><span style="opacity:0.85;font-size:0.75rem;">Datei: ' + source + ' | Zeile: ' + lineno + ' | Spalte: ' + colno + '</span></div><button onclick="this.parentElement.parentElement.remove()" style="background:#fff;color:#ef4444;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:0.8rem;flex-shrink:0;">✕ Schließen</button></div>';
            if (document.body) {
                document.body.appendChild(div);
            } else {
                window.addEventListener('DOMContentLoaded', function() {
                    if (document.body) document.body.appendChild(div);
                });
            }
            return false;
        };
    </script>
