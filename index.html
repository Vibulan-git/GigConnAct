    <!-- Global Error Catcher -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            // Ignore extension or third-party script errors (where source is undefined or not from our domains)
            if (!source || (source.indexOf('gigconnact.de') === -1 && source.indexOf('app.js') === -1 && source.indexOf('localhost') === -1 && source.indexOf('127.0.0.1') === -1)) {
                console.warn("Ignored cross-domain/extension error:", message, "Source:", source);
                return false; 
            }
            var div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = '#ef4444';
            div.style.color = '#fff';
            div.style.padding = '1rem';
            div.style.zIndex = '999999';
            div.style.fontFamily = 'monospace';
            div.style.fontSize = '0.9rem';
            div.style.boxSizing = 'border-box';
            div.style.textAlign = 'left';
            div.innerHTML = '<strong>JavaScript Fehler:</strong> ' + message + '<br>Datei: ' + source + '<br>Zeile: ' + lineno + ' | Spalte: ' + colno;
            document.body.appendChild(div);
            return false;
        };
    </script>
