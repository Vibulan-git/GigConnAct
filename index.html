<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigConnAct - Die Plattform für Musiker und Veranstalter</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vanilla CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Mobile Responsive & Compact Fullscreen Hero Background Rules -->
    <style>
        .landing-hero, .hero-section {
            min-height: 68vh !important;
            min-height: 68dvh !important;
            width: 100% !important;
            position: relative !important;
            background-size: cover !important;
            background-position: center center !important;
        }
        .hero-bg-carousel, .hero-bg-slide {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-size: cover !important;
            background-position: center center !important;
        }

        @media (max-width: 768px) {
            .landing-hero {
                min-height: 60vh !important;
                min-height: 60dvh !important;
                padding: 1.8rem 0.8rem 2rem !important;
            }
            .hero-benefits-box {
                padding: 1.2rem 0.9rem !important;
                border-radius: 14px !important;
                max-width: 100% !important;
                margin: 0 auto !important;
            }
            .hero-tab-nav {
                flex-direction: column !important;
                gap: 0.6rem !important;
                width: 100% !important;
                margin-bottom: 1.2rem !important;
            }
            .hero-tab-btn {
                width: 100% !important;
                padding: 0.7rem 0.9rem !important;
                font-size: 0.85rem !important;
                text-align: center !important;
            }
            .hero-benefit-cards {
                grid-template-columns: 1fr !important;
                gap: 0.75rem !important;
            }

            /* Musiker-Markt Page Layout & Tile Scaling */
            .market-page {
                padding: 1rem 0.65rem 4rem !important;
            }
            .market-page h1 {
                font-size: 1.3rem !important;
            }
            .market-sort-bar {
                padding: 0.5rem 0.75rem !important;
                margin-bottom: 1rem !important;
                border-radius: 10px !important;
            }
            .market-sort-bar select {
                font-size: 0.78rem !important;
                padding: 0.35rem 0.5rem !important;
            }
            .market-tile-card {
                border-radius: 14px !important;
            }
            .tile-fullwidth-photo-slider {
                height: 185px !important;
            }
            .tile-body-content {
                padding: 0.9rem 0.9rem 0.6rem !important;
            }
            .tile-info-list {
                font-size: 0.8rem !important;
                gap: 0.35rem !important;
                margin-bottom: 0.5rem !important;
            }
            .tile-info-list i {
                font-size: 0.82rem !important;
                width: 15px !important;
            }
            .tile-description {
                padding-top: 0.4rem !important;
                margin-bottom: 0.4rem !important;
            }
            .tile-description p {
                font-size: 0.8rem !important;
                line-height: 1.4 !important;
            }
            .tile-action-container {
                padding: 0 0.9rem 0.9rem !important;
            }
            .tile-action-container .btn {
                padding: 0.7rem !important;
                font-size: 0.82rem !important;
                border-radius: 8px !important;
            }
            .landing-hero h1 {
                white-space: normal !important;
                font-size: clamp(1.2rem, 5vw, 1.8rem) !important;
                word-break: break-word !important;
                margin-bottom: 0.5rem !important;
            }
            .brand-logo-center {
                font-size: clamp(2rem, 7.5vw, 3.2rem) !important;
                margin-bottom: 0.4rem !important;
            }
            .landing-hero p {
                font-size: 0.88rem !important;
                line-height: 1.45 !important;
                margin-bottom: 1.2rem !important;
            }
            .landing-hero .btn-hero-cta {
                width: 100% !important;
                padding: 0.85rem 1.1rem !important;
                font-size: 0.92rem !important;
                justify-content: flex-start !important;
                box-sizing: border-box !important;
                border-radius: 10px !important;
            }
            .landing-hero .btn-hero-cta i {
                font-size: 1.8rem !important;
            }
            .market-layout-container {
                grid-template-columns: 1fr !important;
                gap: 1rem !important;
            }
            .market-filter-card {
                position: static !important;
                max-height: none !important;
                width: 100% !important;
                box-sizing: border-box !important;
                padding: 1rem !important;
            }
            .market-filter-mobile-toggle {
                display: flex !important;
                padding: 0.75rem !important;
                font-size: 0.88rem !important;
            }
            #market-items-grid {
                grid-template-columns: 1fr !important;
                gap: 1.2rem !important;
            }
            .navbar {
                padding: 0.6rem 0.8rem !important;
            }
            .navbar .container {
                flex-wrap: wrap !important;
                gap: 0.5rem !important;
            }
            .logo {
                font-size: 1.2rem !important;
            }
            .nav-link {
                padding: 0.35rem 0.5rem !important;
                font-size: 0.78rem !important;
            }
        }

        .market-filter-mobile-toggle {
            display: none;
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <!-- App Root Container -->
    <div id="app" class="app-container">
        <!-- Navigation Bar -->
        <header class="app-header">
            <div class="header-container">
                <a href="#" class="logo-area" id="logo-link">
                    <div class="logo-getyourgig-nav">
                        <div class="logo-title-nav">GigConnAct</div>
                        <div class="logo-underline-connector-nav">
                            <i class="fa-solid fa-guitar logo-sub-icon-nav music-sub"></i>
                            <span class="connector-line-nav"></span>
                            <i class="fa-solid fa-calendar-check logo-sub-icon-nav event-sub"></i>
                        </div>
                    </div>
                </a>
                
                <!-- Main Navigation -->
                <nav class="main-nav" id="main-nav">
                    <!-- Dynamic navigation links will be generated here -->
                </nav>

                <!-- Auth Buttons / User Area -->
                <div class="auth-area" id="auth-area">
                    <!-- Dynamic login/register/logout buttons will be here -->
                </div>
            </div>
        </header>

        <!-- Main Workspace Area -->
        <main class="app-main" id="app-main">
            <!-- Dynamic pages will be injected here: Landing Page, Markets, Dashboard, Postbox, Profile -->
        </main>

        <!-- Notification Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Modals Container -->
        <div id="modal-container" class="modal-overlay hidden">
            <!-- Dynamic modals will be injected here (Login, Registrations, SEPA, Mail confirmation) -->
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 GigConnAct. Alle Rechte vorbehalten. | <span class="premium-badge">Musiker-Abo: 5 € / Monat (oder 50 € / Jahr)</span> | <a href="#" id="btn-reset-demo" style="color:var(--color-red); margin-left: 10px; text-decoration: underline;">Demo-Daten zurücksetzen</a></p>
        </footer>
    </div>

    <!-- Main JavaScript Entry Point -->
    <script src="app.js?v=100"></script>
</body>
</html>
