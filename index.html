<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigConnAct - Die Plattform für Musiker und Veranstalter</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vanilla CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Mobile Responsive Styling Rules -->
    <style>
        @media (max-width: 768px) {
            .market-layout-container {
                grid-template-columns: 1fr !important;
                gap: 1.2rem !important;
            }
            .market-filter-card {
                position: static !important;
                max-height: none !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            .market-filter-mobile-toggle {
                display: flex !important;
            }
            #market-items-grid {
                grid-template-columns: 1fr !important;
                gap: 1.5rem !important;
            }
            .market-tile-card {
                width: 100% !important;
                border-radius: 14px !important;
            }
            .tile-fullwidth-photo-slider {
                height: 200px !important;
            }
            .hero-section {
                padding: 2.5rem 1rem 3.5rem !important;
                min-height: auto !important;
            }
            .btn-hero-cta {
                width: 100% !important;
                justify-content: flex-start !important;
                padding: 1rem 1.4rem !important;
            }
            .navbar {
                padding: 0.8rem 1rem !important;
            }
            .navbar .container {
                flex-wrap: wrap !important;
                gap: 0.6rem !important;
            }
            .logo {
                font-size: 1.3rem !important;
            }
            .nav-link {
                padding: 0.4rem 0.6rem !important;
                font-size: 0.82rem !important;
            }
            h1 {
                font-size: 1.7rem !important;
            }
        }

        .market-filter-mobile-toggle {
            display: none;
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <!-- App Root Container -->
    <div id="app" class="app-container">
        <!-- Navigation Bar -->
        <header class="app-header">
            <div class="header-container">
                <a href="#" class="logo-area" id="logo-link">
                    <div class="logo-getyourgig-nav">
                        <div class="logo-title-nav">GigConnAct</div>
                        <div class="logo-underline-connector-nav">
                            <i class="fa-solid fa-guitar logo-sub-icon-nav music-sub"></i>
                            <span class="connector-line-nav"></span>
                            <i class="fa-solid fa-calendar-check logo-sub-icon-nav event-sub"></i>
                        </div>
                    </div>
                </a>
                
                <!-- Main Navigation -->
                <nav class="main-nav" id="main-nav">
                    <!-- Dynamic navigation links will be generated here -->
                </nav>

                <!-- Auth Buttons / User Area -->
                <div class="auth-area" id="auth-area">
                    <!-- Dynamic login/register/logout buttons will be here -->
                </div>
            </div>
        </header>

        <!-- Main Workspace Area -->
        <main class="app-main" id="app-main">
            <!-- Dynamic pages will be injected here: Landing Page, Markets, Dashboard, Postbox, Profile -->
        </main>

        <!-- Notification Toast Container -->
        <div id="toast-container" class="toast-container"></div>

        <!-- Modals Container -->
        <div id="modal-container" class="modal-overlay hidden">
            <!-- Dynamic modals will be injected here (Login, Registrations, SEPA, Mail confirmation) -->
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 GigConnAct. Alle Rechte vorbehalten. | <span class="premium-badge">Musiker-Abo: 5 € / Monat (oder 50 € / Jahr)</span> | <a href="#" id="btn-reset-demo" style="color:var(--color-red); margin-left: 10px; text-decoration: underline;">Demo-Daten zurücksetzen</a></p>
        </footer>
    </div>

    <!-- Main JavaScript Entry Point -->
    <script src="app.js?v=25"></script>
</body>
</html>
